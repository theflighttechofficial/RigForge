        <h1>Build your Own Pc from scratch</h1>
        <p>Silicon Matrix is a free PC hardware planner with Indian prices. Pick a CPU, GPU, motherboard, RAM, storage, power supply, case and cooler. It checks socket compatibility, CPU/GPU bottlenecks at 1080p, 1440p and 4K, power supply sizing, estimated FPS and 3-year electricity cost, and prices the build in rupees with 18% GST. The catalog covers 91 CPUs and 78 GPUs.</p>
        <h2>Supported platforms</h2>
        <ul>
          <li>Web browser on desktop and mobile: Chrome, Edge, Firefox and Safari</li>
          <li>Hardware scan of your own PC: Windows</li>
          <li>Hardware scan of your own PC: macOS</li>
          <li>Hardware scan of your own PC: Linux</li>
          <li>Self-hosting: Node.js 18 or later, or Docker</li>
        </ul>
        <p>JavaScript is needed to use the planner. Source code: <a href="https://github.com/theflighttechofficial/RigForge">github.com/theflighttechofficial/RigForge</a></p>
